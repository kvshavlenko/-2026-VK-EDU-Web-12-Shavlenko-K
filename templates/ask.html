{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card bg-dark-gray shadow-sm">
            <div class="card-body p-4">
                <h2 class="text-white mb-4">Задать вопрос</h2>
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="text-light-gray">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger small">{{ field.errors }}</div>
                            {% endif %}
                        </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-green w-100 fw-bold">Опубликовать</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
