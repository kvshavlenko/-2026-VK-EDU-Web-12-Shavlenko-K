{% load static %}
<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AskPupkin</title>
    <link rel="icon" href="{% static 'img/pupkin.png' %}" type="image/png">
    
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="d-flex flex-column min-vh-100 bg-pure-black">

    <!-- шапка -->
    <nav class="navbar navbar-expand-lg bg-dark-gray border-bottom border-secondary">
        <div class="container">
            <a class="navbar-brand fs-3 fw-bold text-white" href="{% url 'index' %}">AskPupkin</a>

            <form class="d-flex flex-grow-1 mx-4 search-form" role="search">
                <input class="form-control me-2 search-input" type="search" placeholder="Поиск...">
                <a href="{% url 'ask' %}" class="btn btn-green fw-bold">ASK!</a>
            </form>
            
            <!-- ПРОВЕРКА: если мы на странице логина, регистрации или создания вопроса -->
            {% if user.is_authenticated %}
                <div class="d-flex align-items-center gap-3">
                    <img src="{% static 'img/avatar.png' %}" alt="Avatar" class="rounded-circle border border-secondary" width="40" height="40">
                    <div class="d-flex flex-column user-info">
                        <a class="fw-bold text-white text-decoration-none" href="#">Dr. Pepper</a>
                        <div class="d-flex gap-2 small">
                            <a href="#" class="link-white">settings</a>
                            <a href="#" class="text-decoration-none text-danger">log out</a>
                        </div>
                    </div>
                </div>
            {% else %}
                <div class="d-flex gap-3">
                    <a href="#" class="link-white fw-bold">log in</a>
                    <a href="#" class="link-white fw-bold">register</a>
                </div>
            {% endif %}
            
        </div>
    </nav>

    <!-- основная часть -->
    <main class="container flex-grow-1 mt-4">
        <div class="row g-4">
            
            <!-- левая колонка -->
            <div class="col-lg-8">
                {% block content %}
                {% endblock %}
            </div>

            <!-- правая колонка -->
            
            <div class="col-lg-4">
                    {% include 'sidebar.html' %}
            </div>
        </div>
    </main>

    <!-- подвал -->
    <footer class="bg-dark-gray border-top border-secondary py-4 mt-auto">
        <div class="container text-center">
            <p class="text-light-gray mb-0">&copy; 2026 AskPupkin. Все права защищены.</p>
        </div>
    </footer>

    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
